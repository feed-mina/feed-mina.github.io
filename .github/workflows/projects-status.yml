name: Projects status

# 30분마다 프로젝트 상태를 모아 projects-status/status.json 을 갱신한다.
# 내용이 바뀐 경우에만 커밋하고, GitHub Pages 재빌드를 요청한다.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: projects-status
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Collect status
        env:
          # 읽기 전용 fine-grained 토큰 (레포 8개, Actions·Contents·Pull requests·Metadata 읽기)
          # 없으면 기본 토큰으로 공개 레포만 읽고, 비공개 레포는 "권한 없음"으로 표시된다.
          STATUS_TOKEN: ${{ secrets.STATUS_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/collect-projects-status.mjs

      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet -- projects-status/status.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects-status/status.json
          git commit -m "chore(projects-status): update status"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Request Pages build
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages build request failed; the next push will rebuild."
