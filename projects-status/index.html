<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>프로젝트 진행 현황 | feed-mina</title>
<meta name="description" content="민예린이 운영 중인 프로젝트들의 최근 반영, 빌드, 배포 상태를 한 화면에 모았습니다.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root{--bg:#F4F5F7;--card:#FFFFFF;--line:#DDE1E6;--soft:#F7F8FA;--ink:#1B1F24;--ink2:#343A44;--ink3:#4A5260;--tag:#EEF1F5;
--ok:#1E7A46;--fail:#B54708;--run:#1F4FBF;--warn:#8A6A00;--none:#8A929E;--link:#1F4FBF}
@media(prefers-color-scheme:dark){:root{--bg:#121417;--card:#1B1E23;--line:#2C3138;--soft:#22262C;--ink:#E8EAED;--ink2:#C9CDD3;--ink3:#A3AAB4;--tag:#2A2F36;
--ok:#4CC38A;--fail:#F0884A;--run:#7FA6FF;--warn:#E3C04F;--none:#8A929E;--link:#8FB2FF}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;word-break:keep-all;overflow-wrap:anywhere}
a{color:var(--link)}
.wrap{max-width:1280px;margin:0 auto;padding:32px 16px 56px;display:flex;flex-direction:column;gap:24px}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--ink3)}
h1{margin:4px 0;font-size:30px;line-height:1.25}
.lead{margin:0;color:var(--ink3)}
.stamp{font-size:13px;color:var(--ink3)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.tile .label{font-size:13px;color:var(--ink3)}
.tile .value{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2;margin:2px 0}
.tile .sub{font-size:12px;color:var(--ink3)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:12px}
.card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.card h2{margin:0;font-size:17px}
.card .desc{font-size:13px;color:var(--ink3)}
.tag{flex-shrink:0;font-size:12px;font-weight:500;padding:3px 10px;border-radius:999px;background:var(--tag);color:var(--ink2)}
.stages{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stage{background:var(--soft);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:4px;min-width:0}
.stage .k{font-size:12px;color:var(--ink3)}
.stage .v{display:flex;align-items:flex-start;gap:6px;font-size:13px;font-weight:500}
.dot{width:10px;height:10px;margin-top:5px;border-radius:50%;flex-shrink:0;background:var(--c)}
.dot.none,.dot.unknown{background:none;border:2px solid var(--none)}
.ok{--c:var(--ok)}.fail{--c:var(--fail)}.run{--c:var(--run)}.warn{--c:var(--warn)}
.last{margin:0;font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.links{display:flex;flex-wrap:wrap;gap:14px;font-size:13px}
.pr{font-size:12px;color:var(--ink3)}
.legend{font-size:12px;color:var(--ink3);line-height:1.8}
.legend span{display:inline-flex;align-items:center;gap:6px;margin-right:12px}.legend .dot{margin-top:0}
.msg{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;color:var(--ink3)}
</style>
</head>
<body>
<main class="wrap">
  <header>
    <div>
      <div class="eyebrow">FEED-MINA · PROJECTS</div>
      <h1>프로젝트 진행 현황</h1>
      <p class="lead">운영 중인 프로젝트의 최근 반영, 빌드, 배포 상태입니다. 30분마다 확인해서 바뀐 것만 반영합니다.</p>
    </div>
    <span class="stamp" id="stamp">불러오는 중…</span>
  </header>
  <section class="tiles" id="tiles" aria-label="요약"></section>
  <section class="grid" id="grid" aria-label="프로젝트"><noscript><div class="msg">이 화면은 자바스크립트로 상태 파일(status.json)을 읽어 그립니다. <a href="status.json">상태 파일 직접 보기</a></div></noscript></section>
  <p class="legend">
    <span><i class="dot ok"></i>성공</span><span><i class="dot fail"></i>실패</span><span><i class="dot run"></i>실행 중</span><span><i class="dot warn"></i>확인 필요</span><span><i class="dot none"></i>수동·없음</span><br>
    색과 글자를 함께 표시합니다. 비공개 프로젝트는 커밋 내용과 링크를 숨기고 상태만 보여 줍니다. 자동 검사나 배포가 없는 프로젝트는 실패가 아니라 "수동·없음"으로 표시합니다.
  </p>
</main>
<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
  var kst=function(iso){var d=new Date(new Date(iso).getTime()+9*3600000);return d.toISOString().slice(5,16).replace('T',' ')};
  function ago(iso){
    if(!iso)return '';
    var m=Math.round((Date.now()-new Date(iso))/60000);
    if(m<60)return Math.max(m,1)+'분 전';
    var h=Math.round(m/60);if(h<24)return h+'시간 전';
    return Math.round(h/24)+'일 전';
  }
  function stage(k,s,withAgo){
    var text=s.text+(withAgo&&s.date&&s.state!=='none'?' · '+ago(s.date):'');
    return '<div class="stage"><span class="k">'+k+'</span><span class="v"><i class="dot '+esc(s.state)+'" aria-hidden="true"></i>'+esc(text)+'</span></div>';
  }
  function card(r){
    var main=r.main&&r.main.date?{state:'ok',text:ago(r.main.date),date:null}:{state:'unknown',text:'확인 불가',date:null};
    var last=!r.ok?'상태를 읽지 못했습니다':r.masked?'비공개 프로젝트 · 내용 숨김':esc(kst(r.main.date))+' · '+esc(r.main.message);
    var pr=r.prs&&r.prs.open?'<span class="pr">열린 PR '+r.prs.open+'건'+(r.prs.draft?' (초안 '+r.prs.draft+')':'')+(r.prs.stale?' · 30일 넘은 초안 '+r.prs.stale:'')+'</span>':'';
    var links=(r.url?'<a href="'+esc(r.url)+'">저장소</a>':'')+(r.live?'<a href="'+esc(r.live)+'">라이브 보기</a>':'')+(r.build&&r.build.url?'<a href="'+esc(r.build.url)+'">빌드 기록</a>':'');
    return '<article class="card"><div class="top"><div><h2>'+esc(r.name)+'</h2><div class="desc">'+esc(r.label)+'</div></div><span class="tag">'+esc(r.target)+'</span></div>'
      +'<div class="stages">'+stage('main 반영',main)+stage('빌드',r.build)+stage('배포',r.deploy,true)+'</div>'
      +'<p class="last" title="'+(r.masked?'':esc(r.main&&r.main.message))+'">'+last+'</p>'
      +((links||pr)?'<div class="links">'+links+pr+'</div>':'')+'</article>';
  }
  function tile(label,value,sub,cls){return '<div class="tile '+cls+'"><div class="label">'+label+'</div><div class="value" style="color:var(--c,var(--ink))">'+value+'</div><div class="sub">'+sub+'</div></div>'}
  fetch('status.json',{cache:'no-cache'}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()}).then(function(d){
    var s=d.summary;
    $('stamp').textContent='마지막 변경 '+kst(d.generatedAt)+' KST';
    $('tiles').innerHTML=tile('빌드·배포 실패',s.fail,'최신 커밋 기준',s.fail?'fail':'')+tile('최근 7일 반영',s.recent7,'main에 새 커밋이 들어온 프로젝트','ok')
      +tile('열린 PR',s.openPr,s.draftPr?'그중 초안 '+s.draftPr+'건':'초안 없음','run')+tile('수동·확인 필요',s.manual,'자동 배포 신호가 없는 프로젝트','');
    $('grid').innerHTML=d.repos.map(card).join('');
  }).catch(function(){
    $('stamp').textContent='';
    $('grid').innerHTML='<div class="msg">상태 파일을 불러오지 못했습니다. 잠시 후 다시 열어 주세요.</div>';
  });
})();
</script>
</body>
</html>
